worker_processes auto;
events { worker_connections 4096; }
http {
    access_log off;
    upstream auth {
        server 10.77.20.21:3000;
        server 10.77.20.22:3000;
        keepalive 32;
    }
    upstream api {
        server 10.77.20.31:8080;
        server 10.77.20.32:8080;
        keepalive 64;
    }
    server {
        listen 8080;
        client_max_body_size 64k;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        location = /health { default_type application/json; return 200 '{"status":"ok","service":"web"}'; }
        location = / { default_type application/json; return 200 '{"app":"isolated-shopping-lab"}'; }
        location /auth/ { proxy_pass http://auth/; }
        location /api/ { proxy_pass http://api/; }
    }
}
