[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-trust-microsegmentation"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.115.6",
  "httpx==0.28.1",
  "networkx==3.4.2",
  "numpy==2.2.1",
  "pydantic==2.10.4",
  "scikit-learn==1.6.0",
  "uvicorn==0.34.0",
]

[project.scripts]
ztm-sim = "app.main:run"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

